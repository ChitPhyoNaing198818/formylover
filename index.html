<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Infinite Universe ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff4d9d;
            --deep-purple: #8a2be2;
            --glass-bg: rgba(255, 255, 255, 0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background: #020205;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* Overlay to force interaction for Audio */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #starCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
        }

        .nebula {
            position: fixed;
            top: 50%; left: 50%;
            width: 150vmax; height: 150vmax;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, 
                rgba(255, 77, 157, 0.08) 0%, 
                rgba(138, 43, 226, 0.05) 40%, 
                transparent 70%);
            z-index: -1;
            animation: nebulaPulse 15s ease-in-out infinite alternate;
        }

        @keyframes nebulaPulse {
            0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2) rotate(10deg); opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 850px;
            padding: 50px 30px;
            border-radius: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            text-align: center;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .photo-universe {
            position: relative;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            transform-style: preserve-3d;
        }

        .center-heart {
            font-size: 65px;
            filter: drop-shadow(0 0 15px var(--primary-pink));
            animation: heartbeat 2.5s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1) translateZ(30px); }
            50% { transform: scale(1.1) translateZ(50px); }
        }

        .memory-orb {
            position: absolute;
            width: 120px; height: 120px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .orb-1 { top: -10%; left: 10%; animation: float 7s infinite ease-in-out; }
        .orb-2 { bottom: -10%; right: 5%; animation: float 9s infinite ease-in-out reverse; }
        .orb-3 { top: 0%; right: 10%; animation: float 8s infinite ease-in-out 1s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateZ(20px); }
            50% { transform: translateY(-20px) translateZ(40px); }
        }

        h1 {
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.2rem, 4vw, 2.2rem);
            letter-spacing: 7px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .letter-box {
            color: #ececec;
            line-height: 1.8;
            font-size: clamp(0.9rem, 2vw, 1.05rem);
            background: rgba(0, 0, 0, 0.5);
            padding: 35px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 650px;
            margin: 0 auto;
            text-align: left;
            min-height: 180px;
        }

        .typing::after {
            content: '|';
            color: var(--primary-pink);
            animation: blink 0.8s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .signature {
            margin-top: 25px;
            text-align: right;
            font-weight: 600;
            color: var(--primary-pink);
            opacity: 0;
            transition: opacity 2s ease;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <p style="font-family: 'Orbitron'; letter-spacing: 2px;">CLICK TO ENTER UNIVERSE</p>
    </div>

    <canvas id="starCanvas"></canvas>
    <div class="nebula"></div>
    
    <div class="container" id="card">
        <div class="photo-universe">
            <div class="center-heart">❤️</div>
            <img src="imageone.jpg" class="memory-orb orb-1" alt="1">
            <img src="imagetwo.jpg" class="memory-orb orb-2" alt="2">
            <img src="imagethree.jpg" class="memory-orb orb-3" alt="3">
        </div>

        <h1>My Little Universe</h1>

        <div class="letter-box">
            <span id="typewriter"></span>
            <div class="signature" id="sig">— Kyaw Thu Htet</div>
        </div>
    </div>

    <!-- Corrected Audio Path -->
    <audio id="bgMusic" loop preload="auto">
        <source src="./music.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        const textElement = document.getElementById('typewriter');
        const signature = document.getElementById('sig');
        const music = document.getElementById('bgMusic');
        const card = document.getElementById('card');
        const overlay = document.getElementById('overlay');

        const content = `Dear Yu Yu Zaw,

ခလေး ပျော်နေတဲ့လမ်းမှာ ကိုမပါလည်း....အဝေးကနေဆုတောင်းပေးနေမိတဲ့ကောင်ပါ
ပြန်သွားတဲ့လက်တစ်ဖက်ကို ဆွဲမထားခဲ့ဘူး ဒါပေမဲ့ ပြန်လာမဲ့နေ့ရှိမလားဆိုတဲ့မျှော်လင့်ချက်ကလေးကိုတော့ ရင်ထဲကမဖျက်နိုင်သေးဘူး
ခလေးမ မရွေးတဲ့လူက ကိုယ်ဖြစ်နေပေမဲ့ မင်းကိုအချစ်ဆုံးလူက ကိုယ်ပဲဖြစ်နေတုန်းပဲ`;

        let stars = [];
        const numStars = 400;
        let speed = 0.5;

        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * canvas.width - canvas.width / 2,
                    y: Math.random() * canvas.height - canvas.height / 2,
                    z: Math.random() * canvas.width,
                    o: Math.random()
                });
            }
        }

        function drawStars() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = "#020205";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.translate(canvas.width / 2, canvas.height / 2);

            for (let i = 0; i < numStars; i++) {
                let s = stars[i];
                s.z -= speed;
                if (s.z <= 0) s.z = canvas.width;

                let x = s.x * (canvas.width / s.z);
                let y = s.y * (canvas.width / s.z);
                let r = 1.5 * (canvas.width / s.z);

                ctx.beginPath();
                ctx.fillStyle = `white`;
                ctx.globalAlpha = s.o;
                ctx.arc(x, y, r / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            requestAnimationFrame(drawStars);
        }

        let charIndex = 0;
        let hasStarted = false;

        function type() {
            if (charIndex < content.length) {
                let char = content.charAt(charIndex);
                textElement.innerHTML += char === "\n" ? "<br>" : char;
                charIndex++;
                setTimeout(type, Math.random() * 40 + 50);
            } else {
                textElement.classList.remove('typing');
                signature.style.opacity = '1';
                speed = 0.2;
            }
        }

        // Improved Start function for GitHub Pages
        async function startExperience() {
            if (!hasStarted) {
                try {
                    // Try to play audio
                    await music.play();
                    hasStarted = true;
                    overlay.classList.add('hidden');
                    textElement.classList.add('typing');
                    speed = 2;
                    type();
                } catch (err) {
                    console.log("Waiting for user interaction...");
                }
            }
        }

        overlay.addEventListener('click', startExperience);
        window.addEventListener('resize', initStars);

        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;
            card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });

        initStars();
        drawStars();
    </script>
</body>
</html>
